name: Build Web Template

# Builds a size-optimized web export template and uploads it to a GitHub release.
# The Web export job in export.yml downloads it from there, so this only needs to rerun
# when the Godot version or the build profile changes.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - web_template.gdbuild
      - .github/workflows/build-web-template.yml

env:
  GODOT_VERSION: 4.7.2
  # Must match the version Godot's own CI uses for this release (.github/workflows/web_builds.yml)
  EM_VERSION: 4.0.11
  # Optional feature profile, generated from Project > Tools > Engine Compilation Configuration Editor
  BUILD_PROFILE: web_template.gdbuild

jobs:
  build-web-template:
    name: Build Web Template
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: write
    steps:
      - name: Checkout Project
        uses: actions/checkout@v7
        with:
          path: project
      - name: Checkout Godot
        uses: actions/checkout@v7
        with:
          repository: godotengine/godot
          ref: ${{ env.GODOT_VERSION }}-stable
          path: godot
      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: ${{ env.EM_VERSION }}
          no-cache: true
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.x
      - name: Setup SCons
        run: python -m pip install scons==4.10.1
      - name: Build
        working-directory: godot
        run: |
          PROFILE_FLAG=""
          if [ -f "$GITHUB_WORKSPACE/project/$BUILD_PROFILE" ]; then
            PROFILE_FLAG="build_profile=$GITHUB_WORKSPACE/project/$BUILD_PROFILE"
          else
            echo "::warning::No build profile found at $BUILD_PROFILE, building without one"
          fi
          scons platform=web target=template_release threads=no \
            production=yes optimize=size lto=full \
            use_closure_compiler=yes debug_symbols=no \
            disable_3d=yes \
            module_text_server_adv_enabled=no module_text_server_fb_enabled=yes \
            module_csg_enabled=no module_gridmap_enabled=no \
            module_gltf_enabled=no module_fbx_enabled=no \
            module_openxr_enabled=no module_webxr_enabled=no module_mobile_vr_enabled=no \
            module_jolt_physics_enabled=no module_godot_physics_3d_enabled=no \
            module_navigation_3d_enabled=no module_raycast_enabled=no \
            module_lightmapper_rd_enabled=no module_xatlas_unwrap_enabled=no \
            module_meshoptimizer_enabled=no module_vhacd_enabled=no \
            module_theora_enabled=yes \
            module_webrtc_enabled=no module_upnp_enabled=no module_websocket_enabled=no \
            module_enet_enabled=no module_multiplayer_enabled=no module_mbedtls_enabled=no \
            module_jsonrpc_enabled=no \
            $PROFILE_FLAG
          ls -la bin/
      - name: Upload to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="web-template-$GODOT_VERSION"
          cp godot/bin/godot.web.template_release.wasm32.nothreads.zip web-template.zip
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest=false \
              --title "Web Template $GODOT_VERSION" \
              --notes "Size-optimized Godot $GODOT_VERSION web export template, built by build-web-template.yml."
          fi
          gh release upload "$TAG" web-template.zip --repo "$GITHUB_REPOSITORY" --clobber
